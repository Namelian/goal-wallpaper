name: Generate Wallpaper

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 이 부분을 추가하면 Node.js 24로 강제 실행되어 경고가 사라집니다.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # 프로젝트에서 쓰는 노드 버전은 그대로 두셔도 됩니다.

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 의존성 설치
        run: npm install

      - name: 🖥️ Chromium 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libnspr4 libnss3 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            xdg-utils fonts-noto-cjk

      - name: 🎨 배경화면 생성
        run: node generate.js

      - name: 🚀 PNG 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/wallpaper.png
          git diff --staged --quiet || \
            git commit -m "chore: wallpaper $(TZ='Asia/Seoul' date '+%Y-%m-%d')"
          git push


