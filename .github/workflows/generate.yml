name: Generate Wallpaper

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 실패시 최대 3번 재시도
    strategy:
      max-parallel: 1
      matrix:
        attempt: [1]
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 🟢 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: 📦 의존성 설치
        run: npm install

      - name: 🖥️ Chromium 의존성 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libnspr4 libnss3 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 \
            xdg-utils fonts-noto-cjk

      - name: 🎨 배경화면 생성
        run: node generate.js

      - name: 🚀 PNG 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/wallpaper.png
          git diff --staged --quiet || \
            git commit -m "chore: wallpaper $(TZ='Asia/Seoul' date '+%Y-%m-%d')"
          git push

  # 메인 job 실패시 재시도
  retry:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    timeout-minutes: 20

    steps:
      - name: ⏳ 1분 대기 후 재시도
        run: sleep 60
